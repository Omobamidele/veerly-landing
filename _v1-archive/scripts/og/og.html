<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Geist:wght@400;500;600&display=block" rel="stylesheet">
<style>
*{margin:0;box-sizing:border-box}
body{width:1200px;height:630px;background:#4A1FD6;color:#fff;font-family:Geist,sans-serif;position:relative;overflow:hidden}
.glow{position:absolute;width:760px;height:760px;border-radius:50%;right:-220px;bottom:-360px;background:radial-gradient(closest-side,rgba(106,69,255,1),rgba(106,69,255,0))}
.in{position:absolute;inset:72px 80px}
.logo{height:46px}
h1{font-family:'Bricolage Grotesque';font-weight:800;font-size:72px;line-height:1.02;letter-spacing:-0.035em;margin-top:56px;max-width:780px}
.hl{color:#FFD84D}
p{font-size:28px;color:#E6E0FF;margin-top:22px;max-width:720px;line-height:1.35}
.pill{position:absolute;left:0;bottom:0;display:flex;gap:14px}
.pill span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);border-radius:999px;padding:12px 22px;font-size:22px;font-weight:500}
.pill span.y{background:#FFD84D;color:#17122E;border-color:#FFD84D;font-weight:600}
.dot{position:absolute;right:72px;top:170px;width:230px}
</style></head><body><div class="glow"></div><div class="in">
<img class="logo" src="veerly-logo-white.svg" alt="">
<h1>Your career. Your goals. <span class="hl">Your personalized path.</span></h1>
<p>The Veerly Remote Career Accelerator</p>
<div class="pill"><span class="y">Waitlist open</span><span>$7.99 one-time founding cohort</span></div>
</div><img class="dot" src="dot.svg" alt=""></body></html>
